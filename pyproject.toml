[project]
name = "shopee-dommie"
version = "0.2.0"
description = "Shopee shop scraper via Camoufox DOM extraction. Reuses anti-bot-aware auth cookies, navigates shop+product pages, extracts images/descriptions/reviews."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "camoufox>=0.4.11",
    "playwright>=1.40.0",
    "curl-cffi>=0.7.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[project.scripts]
shopee-dommie-login = "scripts.login:main"
shopee-dommie-scrape = "scripts.scrape_shop:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shopee_dommie*"]
exclude = ["tests*", "data*", "scripts*"]

[tool.setuptools.package-data]
shopee_dommie = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests that need Camoufox + valid cookies",
    "slow: marks tests that take more than 2 seconds",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "U", "UP", "B", "SIM", "RUF"]
